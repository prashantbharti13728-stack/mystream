<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyStream - Live Video Platform</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #00e676; }
    .upload-section { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto 30px auto; text-align: center; }
    input[type="file"] { margin: 10px 0; }
    button { background: #00e676; color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .video-card { background: #1e1e1e; border-radius: 8px; overflow: hidden; padding: 10px; }
    video { width: 100%; border-radius: 5px; }
    #status { margin-top: 10px; font-size: 14px; color: #ffeb3b; }
  </style>
</head>
<body>

  <h1>MyStream</h1>

  <div class="upload-section">
    <h3>Video Upload Karein</h3>
    <input type="file" id="videoInput" accept="video/*">
    <br>
    <button id="uploadBtn" onclick="uploadVideo()">Upload Video</button>
    <div id="status"></div>
  </div>

  <h2>Uploaded Videos</h2>
  <div class="video-grid" id="videoGrid">
    <p>Loading videos...</p>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = "https://tkrrvseibcgsasqlfjbu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_-3GqiSqvlunpjVtJN4aQOA_aQFV04QB";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Fetch and display videos on page load
    async function fetchVideos() {
      const videoGrid = document.getElementById('videoGrid');
      videoGrid.innerHTML = '';

      const { data, error } = await supabase.storage.from('videos').list('', {
        limit: 100,
        offset: 0,
        sortBy: { column: 'created_at', order: 'desc' }
      });

      if (error) {
        videoGrid.innerHTML = '<p>Videos load nahi ho payi.</p>';
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        videoGrid.innerHTML = '<p>Abhi tak koi video upload nahi hui hai.</p>';
        return;
      }

      data.forEach(file => {
        if (file.name === '.emptyFolderPlaceholder') return;
        
        const { data: publicUrlData } = supabase.storage.from('videos').getPublicUrl(file.name);
        const videoUrl = publicUrlData.publicUrl;

        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video controls preload="metadata">
            <source src="${videoUrl}" type="video/mp4">
            Aapka browser video tag support nahi karta.
          </video>
        `;
        videoGrid.appendChild(card);
      });
    }

    // Upload video function
    async function uploadVideo() {
      const fileInput = document.getElementById('videoInput');
      const status = document.getElementById('status');
      const uploadBtn = document.getElementById('uploadBtn');

      if (!fileInput.files || fileInput.files.length === 0) {
        alert('Kripya pehle ek video select karein!');
        return;
      }

      const file = fileInput.files[0];
      const fileName = `${Date.now()}_${file.name}`;

      uploadBtn.disabled = true;
      status.innerText = "Video upload ho rahi hai... Kripya wait karein.";

      const { data, error } = await supabase.storage.from('videos').upload(fileName, file, {
        cacheControl: '3600',
        upsert: false
      });

      if (error) {
        status.innerText = "Upload failed: " + error.message;
        console.error(error);
      } else {
        status.innerText = "Video kamyabi se upload ho gayi!";
        fileInput.value = '';
        fetchVideos();
      }

      uploadBtn.disabled = false;
    }

    // Initialize
    fetchVideos();
  </script>

</body>
</html>
