<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystreem - Watch & Stream</title>
    
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            background-color: #0f0f0f; 
            color: #ffffff; 
            overflow: hidden;
        }

        .main-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Top Header */
        header { 
            height: 56px;
            background: #0f0f0f; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 12px; 
            border-bottom: 1px solid #222;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer; 
            flex-shrink: 0;
        }

        .mystreem-logo-icon {
            width: 32px; 
            height: 32px; 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%);
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            font-size: 14px;
        }

        .logo-text { 
            font-size: 18px; 
            font-weight: 800; 
            background: linear-gradient(90deg, #d946ef 0%, #00d2ff 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        /* Search Bar Header */
        .search-box-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: #181818;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 4px 12px;
            max-width: 400px;
        }

        .search-box-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 13px;
            padding: 4px 6px;
        }

        .search-box-container i {
            color: #888;
            font-size: 14px;
        }

        .header-actions { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex-shrink: 0;
        }

        .header-btn { 
            background: none; 
            border: none; 
            color: #fff; 
            font-size: 18px; 
            cursor: pointer; 
        }

        /* Filter Pills Scroll Bar */
        .category-nav { 
            height: 44px;
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding: 8px 12px; 
            background: #0f0f0f; 
            border-bottom: 1px solid #1a1a1a; 
            flex-shrink: 0;
            scrollbar-width: none; 
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-pill { 
            background: #272727; 
            color: #f1f1f1; 
            border: none; 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            white-space: nowrap; 
        }

        .cat-pill.active { 
            background: #fff; 
            color: #0f0f0f; 
        }

        /* Main Scrollable Body Area */
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #0f0f0f;
        }

        .section-panel { display: none; }
        .section-panel.active { display: block; }

        /* Video Feed Grid */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 600px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (min-width: 900px) {
            .video-grid { grid-template-columns: repeat(3, 1fr); }
        }

        /* Video Card Component */
        .video-card {
            background: #121212;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-box video, .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .duration-badge {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .video-details {
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a100ff, #00d2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .video-title {
            font-size: 13px;
            font-weight: 600;
            color: #f1f1f1;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .channel-name, .video-stats {
            font-size: 11px;
            color: #aaa;
        }

        /* Single Video Player View */
        .player-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0f0f0f;
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .player-modal.active { display: flex; }

        .player-header {
            height: 48px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121212;
            border-bottom: 1px solid #222;
        }

        .video-screen {
            width: 100%;
            max-height: 250px;
            background: #000;
        }

        .video-screen video {
            width: 100%;
            height: 100%;
        }

        .player-info-box {
            padding: 12px;
        }

        .player-actions {
            display: flex;
            gap: 10px;
            margin: 12px 0;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .action-chip {
            background: #272727;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .subscribe-btn {
            background: #fff;
            color: #000;
            font-weight: 700;
            border-radius: 18px;
            padding: 6px 16px;
            border: none;
            font-size: 12px;
        }

        /* Shorts Container */
        .shorts-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .short-card {
            width: 100%;
            max-width: 360px;
            height: 520px;
            background: #181818;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid #282828;
        }

        .short-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .short-overlay {
            position: absolute;
            bottom: 16px;
            left: 12px;
            right: 60px;
            z-index: 10;
        }

        .short-sidebar {
            position: absolute;
            right: 12px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            z-index: 10;
        }

        .short-side-btn {
            background: rgba(0,0,0,0.5);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }

        /* Studio & Form Styles */
        .card { 
            background: #181818; 
            border: 1px solid #282828; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 16px; 
        }

        .card-title { 
            font-size: 15px; 
            font-weight: 700; 
            color: #00d2ff; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 10px; 
            background: #0f0f0f; 
            border: 1px solid #333; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 13px; 
            outline: none; 
        }

        .file-upload-box {
            border: 2px dashed #00d2ff;
            background: #111;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .file-upload-box i { font-size: 28px; color: #00d2ff; margin-bottom: 8px; }
        .file-upload-box p { font-size: 12px; color: #aaa; }

        .btn-action { 
            background: linear-gradient(90deg, #a100ff 0%, #00d2ff 100%); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            width: 100%; 
        }

        .btn-danger {
            background: #e53935;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-box { background: #111; border: 1px solid #252525; border-radius: 10px; padding: 12px; text-align: center; }
        .stat-num { font-size: 18px; font-weight: 700; color: #fff; margin-top: 4px; }
        .stat-lbl { font-size: 11px; color: #aaa; }

        .progress-bar-bg { background: #282828; height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0; }
        .progress-bar-fill { background: linear-gradient(90deg, #a100ff 0%, #00d2ff 100%); height: 100%; width: 0%; transition: width 0.3s ease; }

        .manage-item { display: flex; justify-content: space-between; align-items: center; background: #111; border: 1px solid #252525; border-radius: 8px; padding: 10px; margin-bottom: 10px; }

        /* Bottom Nav */
        .bottom-nav { 
            height: 56px;
            background: #0d0d0d; 
            border-top: 1px solid #222; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            flex-shrink: 0;
            z-index: 1000;
        }

        .nav-item { 
            color: #888; 
            font-size: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 3px; 
            cursor: pointer; 
            flex: 1; 
            border: none;
            background: transparent;
            height: 100%;
        }

        .nav-item.active { color: #fff; }
        .nav-item i, .nav-item span { pointer-events: none; }
        
        .nav-item-plus { 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%); 
            width: 40px; 
            height: 28px; 
            border-radius: 14px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 15px; 
            color: #fff; 
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="main-app">
        <!-- Top Header Bar -->
        <header>
            <div class="logo-container" onclick="openTab('home')">
                <div class="mystreem-logo-icon"><i class="fa-solid fa-play"></i></div>
                <div class="logo-text">Mystreem</div>
            </div>

            <!-- Live Functional Search Box -->
            <div class="search-box-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search videos, tutorials..." oninput="filterVideos()">
            </div>

            <div class="header-actions">
                <button class="header-btn" onclick="openTab('dashboard')"><i class="fa-solid fa-chart-line"></i></button>
            </div>
        </header>

        <!-- Category Pills Bar -->
        <div class="category-nav">
            <button class="cat-pill active" onclick="filterCategory('All', this)">All</button>
            <button class="cat-pill" onclick="filterCategory('Tech & Electronics', this)">Tech & Electronics</button>
            <button class="cat-pill" onclick="filterCategory('Mobile Repairing', this)">Mobile Repairing</button>
            <button class="cat-pill" onclick="filterCategory('Indian Soap Operas', this)">Indian Soap Operas</button>
            <button class="cat-pill" onclick="filterCategory('Business Ideas', this)">Business Ideas</button>
        </div>

        <!-- Scrollable Content Area -->
        <div class="content-container">

            <!-- 1. HOME FEED (View Videos) -->
            <div id="home" class="section-panel active">
                <div class="video-grid" id="homeVideoGrid">
                    <!-- Dynamic Videos Render Here -->
                </div>
            </div>

            <!-- 2. SHORTS FEED -->
            <div id="shorts" class="section-panel">
                <div class="shorts-container" id="shortsFeedGrid">
                    <!-- Dynamic Shorts Render Here -->
                </div>
            </div>

            <!-- 3. UPLOAD VIDEO (Creator Section) -->
            <div id="upload" class="section-panel">
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-upload"></i> Upload Video or Short</div>
                    
                    <div class="form-group">
                        <label>Video Format Type</label>
                        <select id="uploadTypeSelect">
                            <option value="Long Video">Long Video (Horizontal)</option>
                            <option value="Shorts">YouTube Short (Vertical)</option>
                        </select>
                    </div>

                    <!-- File Picker -->
                    <div class="file-upload-box" onclick="document.getElementById('videoFileInput').click()">
                        <i class="fa-solid fa-file-video"></i>
                        <p id="fileSelectedText">Tap to select Video File from Phone</p>
                        <input type="file" id="videoFileInput" accept="video/*" style="display:none;" onchange="handleFileSelect(this)">
                    </div>

                    <!-- Preview -->
                    <div id="videoPreviewBox" style="display:none; margin-bottom:12px;">
                        <video id="videoPreview" controls style="width:100%; max-height:180px; border-radius:8px; background:#000;"></video>
                    </div>

                    <div class="form-group">
                        <label>Video Title</label>
                        <input type="text" id="videoTitleInput" placeholder="Enter video title...">
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <select id="videoCategoryInput">
                            <option value="Tech & Electronics">Tech & Electronics</option>
                            <option value="Mobile Repairing">Mobile Repairing</option>
                            <option value="Indian Soap Operas">Indian Soap Operas</option>
                            <option value="Business Ideas">Business Ideas</option>
                        </select>
                    </div>

                    <button class="btn-action" onclick="publishVideo()">Publish Now</button>
                </div>
            </div>

            <!-- 4. DASHBOARD (Analytics) -->
            <div id="dashboard" class="section-panel">
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Creator Studio Analytics</div>
                    <div class="stats-grid">
                        <div class="stat-box"><div class="stat-lbl">Total Views</div><div class="stat-num" id="dashViews">0</div></div>
                        <div class="stat-box"><div class="stat-lbl">Total Likes</div><div class="stat-num" id="dashLikes">0</div></div>
                        <div class="stat-box"><div class="stat-lbl">Total Videos</div><div class="stat-num" id="dashVideos">0</div></div>
                        <div class="stat-box"><div class="stat-lbl">Subscribers</div><div class="stat-num">1,240</div></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-sack-dollar"></i> Monetization Goal</div>
                    <p style="font-size: 12px; color: #ccc;">Target: 10,000 Views for Google AdSense Approval</p>
                    <div style="margin-top: 10px; font-size: 12px; color: #aaa;">Progress Views: <b id="progViews" style="color: #fff;">0 / 10,000</b></div>
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progBar"></div></div>
                </div>
            </div>

            <!-- 5. MANAGE VIDEOS -->
            <div id="manage" class="section-panel">
                <div class="card">
                    <div class="card-title"><i class="fa-solid fa-list-check"></i> Manage Uploaded Content</div>
                    <div id="manageVideosList"></div>
                </div>
            </div>

        </div>

        <!-- Single Video Watch Overlay Player -->
        <div id="playerModal" class="player-modal">
            <div class="player-header">
                <span s
