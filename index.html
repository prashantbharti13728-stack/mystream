<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystreem - Ultimate Video Platform</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            width: 100vw; 
            height: 100vh; 
            background-color: #0f0f0f; 
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body.ambient-mode {
            background: radial-gradient(circle at 50% 20%, rgba(161, 0, 255, 0.15), #0f0f0f 70%);
        }

        header { 
            height: 56px;
            background: #0f0f0f; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 12px; 
            border-bottom: 1px solid #222;
            flex-shrink: 0;
            gap: 8px;
            z-index: 100;
        }

        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer; 
            flex-shrink: 0;
        }

        .mystreem-logo-icon {
            width: 32px; 
            height: 32px; 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%);
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            font-size: 14px;
        }

        .logo-text { 
            font-size: 18px; 
            font-weight: 800; 
            background: linear-gradient(90deg, #d946ef 0%, #00d2ff 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .search-box-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: #181818;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 6px 12px;
            max-width: 400px;
        }

        .search-box-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 13px;
            padding-left: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions i {
            font-size: 16px;
            color: #aaa;
            cursor: pointer;
        }

        .category-nav { 
            height: 48px;
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding: 8px 12px; 
            background: #0f0f0f; 
            border-bottom: 1px solid #1a1a1a; 
            flex-shrink: 0;
            scrollbar-width: none; 
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-pill { 
            background: #272727; 
            color: #f1f1f1; 
            border: none; 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            white-space: nowrap; 
        }

        .cat-pill.active { 
            background: #fff; 
            color: #0f0f0f; 
        }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: transparent;
            padding-bottom: 70px;
        }

        .section-panel { display: none; }
        .section-panel.active { display: block; }

        /* Community Post Fixes */
        .community-feed {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .community-card {
            background: #181818;
            border: 1px solid #282828;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
        }

        .community-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .community-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a100ff, #00d2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }

        .community-username {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }

        .community-text {
            font-size: 13px;
            color: #ddd;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .community-img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
            object-fit: cover;
            max-height: 300px;
        }

        .community-actions {
            display: flex;
            gap: 16px;
            align-items: center;
            font-size: 12px;
            color: #aaa;
        }

        .community-like-btn {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .community-like-btn.liked {
            color: #00d2ff;
        }

        .community-input-box {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            width: 100%;
        }

        .community-input-box textarea {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #282828;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            resize: none;
            height: 70px;
            margin-bottom: 8px;
        }

        .btn-action { 
            background: linear-gradient(90deg, #a100ff 0%, #00d2ff 100%); 
            color: #fff; 
            border: none; 
            padding: 10px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            width: 100%; 
        }

        .bottom-nav { 
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: #121212; 
            border-top: 1px solid #222; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            z-index: 1000;
        }

        .nav-item { 
            color: #888; 
            font-size: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 2px; 
            cursor: pointer; 
            flex: 1; 
            border: none;
            background: transparent;
            height: 100%;
        }

        .nav-item.active { color: #fff; }
        .nav-item i { font-size: 18px; }

        .nav-item-plus { 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%); 
            width: 42px; 
            height: 30px; 
            border-radius: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 16px; 
            color: #fff; 
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-container" onclick="openTab('home')">
            <div class="mystreem-logo-icon"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">Mystreem</div>
        </div>

        <div class="search-box-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search videos, podcasts...">
        </div>

        <div class="header-actions">
            <i class="fa-solid fa-circle-half-stroke" title="Ambient Mode"></i>
            <i class="fa-solid fa-bell"></i>
        </div>
    </header>

    <div class="content-container">
        <!-- Community Section -->
        <div id="community" class="section-panel active">
            
            <!-- Post Creation Box -->
            <div class="community-input-box">
                <textarea id="postContentInput" placeholder="Share an update, poll or photo..."></textarea>
                <button class="btn-action" onclick="addNewPost()">Post</button>
            </div>

            <!-- Community Posts Feed -->
            <div class="community-feed" id="communityFeed">
                <!-- Posts will be injected here dynamically via JS -->
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <button class="nav-item" onclick="openTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="openTab('shorts')">
            <i class="fa-solid fa-bolt"></i>
            <span>Shorts</span>
        </button>
        <button class="nav-item" onclick="openTab('upload')">
            <div class="nav-item-plus"><i class="fa-solid fa-plus"></i></div>
        </button>
        <button class="nav-item active" onclick="openTab('community')">
            <i class="fa-solid fa-users"></i>
            <span>Community</span>
        </button>
        <button class="nav-item" onclick="openTab('library')">
            <i class="fa-solid fa-folder"></i>
            <span>Library</span>
        </button>
    </nav>

    <script>
        // Sample Community Posts Data with unique IDs and isLiked state
        let communityPosts = [
            {
                id: 1,
                username: "My Channel",
                text: "New music video coming out tomorrow! Stay tuned 🔥",
                likes: 12,
                isLiked: false
            },
            {
                id: 2,
                username: "My Channel",
                text: "Thank you for 10K subscribers! Big announcement coming soon.",
                likes: 9,
                isLiked: false
            }
        ];

        function renderCommunityPosts() {
            const feed = document.getElementById('communityFeed');
            feed.innerHTML = '';

            communityPosts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'community-card';

                card.innerHTML = `
                    <div class="community-header">
                        <div class="community-avatar">M</div>
                        <div class="community-username">${post.username}</div>
                    </div>
                    <div class="community-text">${post.text}</div>
                    <div class="community-actions">
                        <button class="community-like-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                            <i class="fa-solid fa-thumbs-up"></i> <span>${post.likes} Likes</span>
                        </button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        // Like toggle logic to prevent infinite unwanted increase
        function toggleLike(postId) {
            const post = communityPosts.find(p => p.id === postId);
            if (post) {
                if (post.isLiked) {
                    post.likes -= 1;
                    post.isLiked = false;
                } else {
                    post.likes += 1;
                    post.isLiked = true;
                }
                renderCommunityPosts();
            }
        }

        // Add new post function
        function addNewPost() {
            const input = document.getElementById('postContentInput');
            const text = input.value.trim();
            if(!text) return;

            const newPost = {
                id: Date.now(),
                username: "My Channel",
                text: text,
                likes: 0,
                isLiked: false
            };

            communityPosts.unshift(newPost);
            input.value = '';
            renderCommunityPosts();
        }

        // Initial render
        renderCommunityPosts();

        function openTab(tabName) {
            // Tab switching logic can be added here
        }
    </style>
</body>
</html>
