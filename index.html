<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Mystreem - Meri Jaan</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#efeae2;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:78px;
  background:#075e54;
  color:white;
  display:flex;
  align-items:center;
  padding:8px 14px;
  gap:12px;
}

.dpBox{
  width:56px;
  height:56px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid white;
  cursor:pointer;
  flex-shrink:0;
}

.dpBox img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.headerInfo{
  flex:1;
}

.headerInfo h2{
  font-size:20px;
  font-weight:700;
}

.status{
  font-size:13px;
  margin-top:4px;
  opacity:.85;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:12px 9px 82px;
  background:#efeae2;
}

.message{
  max-width:84%;
  padding:9px 12px;
  margin:7px 0;
  border-radius:10px;
  font-size:16px;
  line-height:1.45;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.ai{
  background:#fff;
  margin-right:auto;
  border-top-left-radius:2px;
}

.user{
  background:#d9ffc7;
  margin-left:auto;
  border-top-right-radius:2px;
}

.time{
  display:block;
  text-align:right;
  font-size:10px;
  color:#777;
  margin-top:4px;
}

/* TYPING */

.typing{
  display:none;
  width:max-content;
  background:#fff;
  padding:8px 13px;
  border-radius:10px;
  margin:6px 0;
  color:#777;
  font-size:14px;
}

/* INPUT */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#f0f0f0;
  padding:7px;
  display:flex;
  gap:7px;
}

.input{
  flex:1;
  border:none;
  outline:none;
  border-radius:25px;
  padding:13px 17px;
  font-size:16px;
  background:white;
}

.send{
  width:50px;
  height:50px;
  border:none;
  border-radius:50%;
  background:#075e54;
  color:white;
  font-size:22px;
  cursor:pointer;
}

/* DP FILE */

#avatarInput{
  display:none;
}

</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <!-- DP पर click करने से Gallery खुलेगी -->

    <label class="dpBox" for="avatarInput">
      <img id="avatar"
           src="https://i.pravatar.cc/200?img=47">
    </label>

    <input
      id="avatarInput"
      type="file"
      accept="image/*"
    >

    <div class="headerInfo">

      <h2>Meri Jaan ❤️</h2>

      <div class="status"
           id="status">
        online
      </div>

    </div>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat">

    <div
      class="typing"
      id="typing">
      typing...
    </div>

  </div>


  <!-- MESSAGE BOX -->

  <div class="bottom">

    <input
      id="messageInput"
      class="input"
      placeholder="Yahan message likhiye..."
      autocomplete="off"
    >

    <button
      id="sendBtn"
      class="send">
      ➤
    </button>

  </div>

</div>


<script>

/* =====================================================
   MYSTREEM COMPANION
   ===================================================== */

const CHAT_KEY =
  "mystreem_ai_gf_chat_v3";

const AVATAR_KEY =
  "mystreem_ai_gf_avatar_v3";

const LAST_USER_MESSAGE =
  "mystreem_last_user_message_v3";

const LAST_AUTO_MESSAGE =
  "mystreem_last_auto_message_v3";


const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const typing =
  document.getElementById("typing");

const avatar =
  document.getElementById("avatar");

const avatarInput =
  document.getElementById("avatarInput");


let messages =
  JSON.parse(
    localStorage.getItem(CHAT_KEY) || "[]"
  );


/* =====================================================
   DP LOAD
   ===================================================== */

const savedAvatar =
  localStorage.getItem(AVATAR_KEY);

if(savedAvatar){

  avatar.src = savedAvatar;

}


/* =====================================================
   DP CHANGE
   ===================================================== */

avatarInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file) return;

    if(!file.type.startsWith("image/")){

      alert("Sirf image select kijiye.");

      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        avatar.src =
          e.target.result;

        localStorage.setItem(
          AVATAR_KEY,
          e.target.result
        );

      };

    reader.readAsDataURL(file);

  }
);


/* =====================================================
   SAVE CHAT
   ===================================================== */

function saveChat(){

  localStorage.setItem(
    CHAT_KEY,
    JSON.stringify(messages)
  );

}


/* =====================================================
   TIME
   ===================================================== */

function getTime(){

  return new Date()
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =====================================================
   ESCAPE
   ===================================================== */

function safe(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   DISPLAY MESSAGE
   ===================================================== */

function displayMessage(
  text,
  type,
  save=true
){

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.innerHTML =
    safe(text) +
    `<span class="time">
      ${getTime()}
    </span>`;

  chat.insertBefore(
    div,
    typing
  );

  if(save){

    messages.push({

      role:
        type === "user"
        ? "user"
        : "assistant",

      content:text,

      timestamp:
        Date.now()

    });

    saveChat();

  }

  scrollBottom();

}


/* =====================================================
   RENDER OLD CHAT
   ===================================================== */

function renderChat(){

  chat.innerHTML = "";

  chat.appendChild(typing);

  messages.forEach(m=>{

    displayMessage(
      m.content,
      m.role === "user"
      ? "user"
      : "ai",
      false
    );

  });

  scrollBottom();

}


/* =====================================================
   SCROLL
   ===================================================== */

function scrollBottom(){

  setTimeout(()=>{

    chat.scrollTop =
      chat.scrollHeight;

  },50);

}


/* =====================================================
   TYPING
   ===================================================== */

function showTyping(){

  typing.style.display =
    "block";

  scrollBottom();

}


function hideTyping(){

  typing.style.display =
    "none";

}


/* =====================================================
   SEND
   ===================================================== */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text) return;

  input.value = "";

  displayMessage(
    text,
    "user"
  );

  localStorage.setItem(
    LAST_USER_MESSAGE,
    Date.now()
  );

  await askAI();

}


/* =====================================================
   REAL AI REQUEST
   ===================================================== */

async function askAI(){

  showTyping();

  try{

    /*
      Last 50 messages AI को context
      के रूप में भेजे जाएंगे।
    */

    const conversation =
      messages.slice(-50);


    const response =
      await fetch(
        "/api/companion-chat",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            messages:
              conversation,

            userLanguage:
              "Hindi/Hinglish"

          })

        }
      );


    if(!response.ok){

      throw new Error(
        "AI server error"
      );

    }


    const data =
      await response.json();


    hideTyping();


    if(
      !data.reply ||
      !data.reply.trim()
    ){

      throw new Error(
        "Empty AI reply"
      );

    }


    displayMessage(
      data.reply,
      "ai"
    );


  }catch(error){

    hideTyping();

    displayMessage(
      "Mujhe abhi tumhari baat ka proper jawab dene mein problem aa rahi hai. Thoda sa time do, phir baat karte hain ❤️",
      "ai"
    );

    console.error(error);

  }

}


/* =====================================================
   1 HOUR CHECK
   ===================================================== */

function checkInactivity(){

  const last =
    Number(
      localStorage.getItem(
        LAST_USER_MESSAGE
      )
    );

  if(!last) return;


  const oneHour =
    60 * 60 * 1000;


  if(
    Date.now() - last <
    oneHour
  ){

    return;

  }


  const lastAuto =
    Number(
      localStorage.getItem(
        LAST_AUTO_MESSAGE
      )
    );


  /*
    Same inactivity period में
    baar-baar message नहीं।
  */

  if(
    lastAuto &&
    Date.now() - lastAuto <
    oneHour
  ){

    return;

  }


  localStorage.setItem(
    LAST_AUTO_MESSAGE,
    Date.now()
  );


  /*
    IMPORTANT:
    ये message भी AI backend से
    generate कराया जा सकता है।
    अभी सिर्फ trigger है।
  */

  displayMessage(
    "Kahan gayab ho gaye tum? 😒 Itni der se tumhara message nahi aaya. Sab theek hai na? ❤️",
    "ai"
  );

}


/* =====================================================
   EVENTS
   ===================================================== */

sendBtn.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      e.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   INITIALIZE
   ===================================================== */

renderChat();


setInterval(
  checkInactivity,
  60 * 1000
);

</script>

</body>
</html>
