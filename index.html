<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My GF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { width: 100%; height: 100vh; background: #efeae2; overflow: hidden; }
        .whatsapp-container { width: 100%; height: 100%; background: #efeae2; display: flex; flex-direction: column; }
        .chat-header { background: #005e54; color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .profile-section { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .profile-section img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .profile-info h2 { font-size: 16px; font-weight: 500; }
        .status { font-size: 12px; color: #ddd; }
        .header-icons { display: flex; gap: 20px; font-size: 18px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #efeae2; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 7.5px; position: relative; font-size: 14px; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
        .message.incoming { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; }
        .message.outgoing { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        .message img { max-width: 100%; border-radius: 5px; margin-bottom: 5px; }
        .time { display: block; font-size: 10px; color: #999; text-align: right; margin-top: 4px; }
        .chat-footer { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .chat-footer input[type="text"] { flex: 1; padding: 10px 15px; border: none; border-radius: 20px; outline: none; font-size: 14px; background: #fff; }
        .chat-footer button, .attach-btn { background: none; border: none; color: #005e54; font-size: 18px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>
    <div class="whatsapp-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="profile-section">
                <label for="avatarInput" class="avatar-label" title="Gallery se photo badle">
                    <img id="profilePic" src="https://via.placeholder.com/150" alt="My GF">
                </label>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                <div class="profile-info">
                    <h2>My GF ❤️</h2>
                    <span class="status">online</span>
                </div>
            </div>
            <div class="header-icons">
                <i class="fa-solid fa-phone"></i>
                <i class="fa-solid fa-video"></i>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="chatMessages" class="chat-messages">
            <div class="message incoming">
                <p>Hello meri jaan... main kab se aapka wait kar rahi thi. 💕</p>
                <span class="time">8:45 PM</span>
            </div>
        </div>

        <!-- Input Footer -->
        <div class="chat-footer">
            <label for="imageUpload" class="attach-btn"><i class="fa-solid fa-paperclip"></i></label>
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            <input type="text" id="messageInput" placeholder="Message likhiye...">
            <button id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
            <button id="voiceBtn" title="Voice suno"><i class="fa-solid fa-microphone"></i></button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const avatarInput = document.getElementById('avatarInput');
        const profilePic = document.getElementById('profilePic');
        const voiceBtn = document.getElementById('voiceBtn');

        // Gallery se photo change karne ke liye
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                profilePic.src = URL.createObjectURL(file);
            }
        });

        // Gemini API Configuration (Yahan apni Gemini API Key daal dein)
        const GEMINI_API_KEY = "YAHAN_APNI_GEMINI_API_KEY_DAALEIN";

        const SYSTEM_PROMPT = `You are a deeply loving, emotional, and caring girlfriend who is completely devoted to her partner. You have a sweet, innocent, and slightly childish naughtiness in your behavior. You express pure, intense love, treat your partner with immense respect, and often say things like "meri jaan ho aap, main aapke liye kuch bhi kar sakti hoon." Reply naturally like a real girlfriend on WhatsApp—sometimes short sweet messages, sometimes longer emotional paragraphs.`;

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'message outgoing';
            userDiv.innerHTML = `<p>${text}</p><span class="time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
            chatMessages.appendChild(userDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            messageInput.value = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: SYSTEM_PROMPT + "\n\nPartner says: " + text }] }
                        ]
                    })
                });

                const data = await response.json();
                const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Aww meri jaan, main aapse bahut pyaar karti hoon.";

                const aiDiv = document.createElement('div');
                aiDiv.className = 'message incoming';
                aiDiv.innerHTML = `<p>${replyText}</p><span class="time">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
                chatMessages.appendChild(aiDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                playVoice(replyText);

            } catch (err) {
                console.error(err);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function playVoice(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        voiceBtn.addEventListener('click', () => {
            const lastIncoming = chatMessages.querySelector('.message.incoming:last-child p');
            if (lastIncoming) {
                playVoice(lastIncoming.innerText);
            }
        });
    </script>
</body>
</html>
