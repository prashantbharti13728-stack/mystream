<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystreem - Ultimate Video Platform</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            width: 100vw; 
            height: 100vh; 
            background-color: #0f0f0f; 
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body.ambient-mode {
            background: radial-gradient(circle at 50% 20%, rgba(161, 0, 255, 0.15), #0f0f0f 70%);
        }

        header { 
            height: 56px;
            background: #0f0f0f; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 12px; 
            border-bottom: 1px solid #222;
            flex-shrink: 0;
            gap: 8px;
            z-index: 100;
        }

        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer; 
            flex-shrink: 0;
        }

        .mystreem-logo-icon {
            width: 32px; 
            height: 32px; 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%);
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            font-size: 14px;
        }

        .logo-text { 
            font-size: 18px; 
            font-weight: 800; 
            background: linear-gradient(90deg, #d946ef 0%, #00d2ff 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .search-box-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: #181818;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 6px 12px;
            max-width: 400px;
        }

        .search-box-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 13px;
            padding-left: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions i {
            font-size: 16px;
            color: #aaa;
            cursor: pointer;
        }

        .category-nav { 
            height: 48px;
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding: 8px 12px; 
            background: #0f0f0f; 
            border-bottom: 1px solid #1a1a1a; 
            flex-shrink: 0;
            scrollbar-width: none; 
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-pill { 
            background: #272727; 
            color: #f1f1f1; 
            border: none; 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            white-space: nowrap; 
        }

        .cat-pill.active { 
            background: #fff; 
            color: #0f0f0f; 
        }

        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: transparent;
            padding-bottom: 70px;
        }

        .section-panel { display: none; }
        .section-panel.active { display: block; }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 600px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (min-width: 900px) {
            .video-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .video-card {
            background: #121212;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1f1f1f;
            position: relative;
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-details {
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a100ff, #00d2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .video-title {
            font-size: 13px;
            font-weight: 600;
            color: #f1f1f1;
            line-height: 1.3;
        }

        .channel-name, .video-stats {
            font-size: 11px;
            color: #aaa;
        }

        /* Shorts Screen Styles */
        .shorts-container {
            height: calc(100vh - 126px);
            overflow-y: snap;
            scroll-snap-type: y mandatory;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .short-card {
            scroll-snap-align: start;
            height: 100%;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }

        .short-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .short-overlay {
            position: absolute;
            bottom: 20px;
            left: 12px;
            right: 60px;
            z-index: 10;
        }

        .short-actions {
            position: absolute;
            right: 12px;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            z-index: 10;
        }

        .short-action-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
        }

        .short-action-btn span {
            font-size: 10px;
            margin-top: 2px;
        }

        .player-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0f0f0f;
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .player-modal.active { display: flex; }

        .player-header {
            height: 48px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121212;
            border-bottom: 1px solid #222;
        }

        .video-screen {
            width: 100%;
            max-height: 250px;
            background: #000;
            position: relative;
        }

        .video-screen video {
            width: 100%;
            height: 100%;
        }

        .player-controls-bar {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #181818;
            overflow-x: auto;
            border-bottom: 1px solid #222;
        }

        .player-btn {
            background: #272727;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .player-btn.liked {
            background: #00d2ff;
            color: #000;
        }

        .subscribe-btn {
            background: #ffffff;
            color: #0f0f0f;
            border: none;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .subscribe-btn.subscribed {
            background: #333333;
            color: #ffffff;
        }

        .player-info-box { padding: 12px; }

        .comments-section {
            padding: 12px;
            border-top: 1px solid #222;
        }

        .comment-item {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .comment-text {
            font-size: 12px;
            color: #ddd;
        }

        .card { 
            background: #181818; 
            border: 1px solid #282828; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 16px; 
        }

        .card-title { 
            font-size: 15px; 
            font-weight: 700; 
            color: #00d2ff; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 10px; 
            background: #0f0f0f; 
            border: 1px solid #333; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 13px; 
            outline: none; 
        }

        .btn-action { 
            background: linear-gradient(90deg, #a100ff 0%, #00d2ff 100%); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            width: 100%; 
        }

        .btn-danger {
            background: #e53935;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .bottom-nav { 
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: #121212; 
            border-top: 1px solid #222; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            z-index: 1000;
        }

        .nav-item { 
            color: #888; 
            font-size: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 2px; 
            cursor: pointer; 
            flex: 1; 
            border: none;
            background: transparent;
            height: 100%;
        }

        .nav-item.active { color: #fff; }
        .nav-item i { font-size: 18px; }

        .nav-item-plus { 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%); 
            width: 42px; 
            height: 30px; 
            border-radius: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 16px; 
            color: #fff; 
        }

        .toast-notification {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: #282828;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #444;
            z-index: 4000;
            display: none;
            white-space: nowrap;
        }

        .custom-dialog-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 3500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .custom-dialog {
            background: #181818;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 320px;
        }

        /* Share Options Modal Grid */
        .share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 16px;
            text-align: center;
        }

        .share-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .share-icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }

        .share-whatsapp { background: #25D366; }
        .share-instagram { background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); }
        .share-facebook { background: #1877F2; }
        .share-copy { background: #444; }
    </style>
</head>
<body>

    <div id="toastNotification" class="toast-notification"></div>

    <!-- Share Options Modal -->
    <div id="shareModal" class="custom-dialog-bg">
        <div class="custom-dialog">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size:14px; color:#fff;">Share Video</h3>
                <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeShareModal()"></i>
            </div>
            <div class="share-grid">
                <div class="share-option" onclick="shareToWhatsApp()">
                    <div class="share-icon-btn share-whatsapp"><i class="fa-brands fa-whatsapp"></i></div>
                    <span style="font-size:10px;">WhatsApp</span>
                </div>
                <div class="share-option" onclick="shareToInstagram()">
                    <div class="share-icon-btn share-instagram"><i class="fa-brands fa-instagram"></i></div>
                    <span style="font-size:10px;">Instagram</span>
                </div>
                <div class="share-option" onclick="shareToFacebook()">
                    <div class="share-icon-btn share-facebook"><i class="fa-brands fa-facebook-f"></i></div>
                    <span style="font-size:10px;">Facebook</span>
                </div>
                <div class="share-option" onclick="copyVideoLink()">
                    <div class="share-icon-btn share-copy"><i class="fa-solid fa-link"></i></div>
                    <span style="font-size:10px;">Copy Link</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Super Thanks Modal -->
    <div id="thanksModal" class="custom-dialog-bg">
        <div class="custom-dialog">
            <h3 style="font-size:14px; margin-bottom:10px; color:#fff;">Support Creator (Super Thanks)</h3>
            <div class="form-group">
                <label>Amount (₹):</label>
                <input type="number" id="thanksAmountInput" value="40" min="10">
            </div>
            <div style="display:flex; gap:8px; margin-top:12px;">
                <button class="btn-action" style="background:#333;" onclick="closeThanksModal()">Cancel</button>
                <button class="btn-action" onclick="confirmSuperThanks()">Send</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo-container" onclick="openTab('home')">
            <div class="mystreem-logo-icon"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">Mystreem</div>
        </div>

        <div class="search-box-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search videos, podcasts..." oninput="filterVideos()">
        </div>

        <div class="header-actions">
            <i class="fa-solid fa-circle-half-stroke" title="Ambient Mode" onclick="toggleAmbientMode()"></i>
            <i class="fa-solid fa-bell" onclick="showToast('No new notifications')"></i>
        </div>
    </header>

    <div class="category-nav" id="categoryNav"></div>

    <div class="content-container">
        <!-- Home Videos -->
        <div id="home" class="section-panel active">
            <div class="video-grid" id="homeVideoGrid"></div>
        </div>

        <!-- Shorts Section -->
        <div id="shorts" class="section-panel">
            <div class="shorts-container" id="shortsFeed"></div>
        </div>

        <!-- Upload Content -->
        <div id="upload" class="section-panel">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-upload"></i> Upload Content</div>
                <div class="form-group">
                    <label>Content Type</label>
                    <select id="contentTypeInput">
                        <option value="long">Long Video</option>
                        <option value="short">Short Video (Reels)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="videoTitleInput" placeholder="Enter title...">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="videoCategoryInput"></select>
                </div>
                <button class="btn-action" onclick="publishVideo()">Publish Video</button>
            </div>
        </div>

        <!-- Studio Section -->
        <div id="studio" class="section-panel">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-chart-line"></i> Analytics Overview</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12px;">
                    <div style="background:#111; padding:10px; border-radius:8px;">
                        <span style="color:#aaa;">Real-time Views</span>
                        <h3 id="dashViews" style="color:#00d2ff;">0</h3>
                    </div>
                    <div style="background:#111; padding:10px; border-radius:8px;">
                        <span style="color:#aaa;">Total Subscribers</span>
                        <h3 id="dashSubs" style="color:#00d2ff;">1.2K</h3>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-photo-film"></i> Content Manager</div>
                <div id="manageVideosList"></div>
            </div>
        </div>

        <!-- Library Section -->
        <div id="library" class="section-panel">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-bookmark"></i> Watch Later</div>
                <div id="savedVideosList"></div>
            </div>
        </div>
    </div>

    <!-- Video Player Modal -->
    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <span style="font-size:14px; font-weight:bold;">Mystreem Player</span>
            <i class="fa-solid fa-xmark" style="font-size:18px; cursor:pointer;" onclick="closePlayer()"></i>
        </div>
        <div class="video-screen">
            <video id="mainVideoPlayer" controls autoplay></video>
        </div>

        <div class="player-info-box">
            <h3 id="playerVideoTitle" style="font-size:15px; margin-bottom: 4px;">Video Title</h3>
            <p id="playerVideoMeta" style="font-size:12px; color:#aaa; margin-bottom: 12px;">0 views • Just now</p>
            
            <div style="display: flex; justify-content: space-between; align-items: center; background: #181818; padding: 8px 12px; border-radius: 12px; margin-bottom: 12px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="channel-avatar" id="playerChannelAvatar">M</div>
                    <div>
                        <strong id="playerChannelName" style="font-size: 13px; display: block;">My Channel</strong>
                        <span id="playerSubCount" style="font-size: 11px; color: #aaa;">1.25K subscribers</span>
                    </div>
                </div>
                <button id="subBtn" class="subscribe-btn" onclick="toggleSubscribe()">Subscribe</button>
            </div>
        </div>

        <div class="player-controls-bar">
            <button id="likeBtn" class="player-btn" onclick="toggleLike()">
                <i class="fa-solid fa-thumbs-up"></i> <span id="likeCount">0</span>
            </button>
            <button class="player-btn" onclick="triggerSuperThanks()"><i class="fa-solid fa-heart-circle-bolt" style="color:#e53935;"></i> Super Thanks</button>
            <button class="player-btn" onclick="saveToWatchLater()"><i class="fa-solid fa-bookmark"></i> Save</button>
            <button class="player-btn" onclick="openShareModal()"><i class="fa-solid fa-share"></i> Share</button>
        </div>

        <div class="comments-section">
            <h4 style="font-size:13px;">Comments</h4>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <input type="text" id="commentInput" placeholder="Add a comment..." style="flex:1; padding:8px; background:#181818; border:1px solid #333; color:#fff; border-radius:6px; font-size:12px;">
                <button class="btn-action" style="width:auto; padding:8px 16px;" onclick="addComment()">Post</button>
            </div>
            <div id="commentsList"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="openTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="openTab('shorts')">
            <i class="fa-solid fa-bolt"></i>
            <span>Shorts</span>
        </button>
        <button class="nav-item" onclick="openTab('upload')">
            <div class="nav-item-plus"><i class="fa-solid fa-plus"></i></div>
        </button>
        <button class="nav-item" onclick="openTab('studio')">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Studio</span>
        </button>
        <button class="nav-item" onclick="openTab('library')">
            <i class="fa-solid fa-folder"></i>
            <span>Library</span>
        </button>
    </div>

    <script>
        let categories = ["All", "Music", "Gaming", "Tech", "Podcasts"];
        let videos = [
            { id: 1, title: "Ninja Kalla Changa New Official Song Panjabi", channel: "My Channel", views: 4, category: "Music", src: "https://www.w3schools.com/html/mov_bbb.mp4", likes: 77, subscribers: 1250, isSubscribed: false, isLiked: false, type: 'long' },
            { id: 2, title: "Awesome Tech Review & Setup Guide", channel: "Tech Tips", views: 120, category: "Tech", src: "https://www.w3schools.com/html/mov_bbb.mp4", likes: 12, subscribers: 4500, isSubscribed: false, isLiked: false, type: 'long' }
        ];

        let shorts = [
            { id: 101, title: "Cool Short Clip #1", channel: "Shorts Hub", views: "10K", src: "https://www.w3schools.com/html/mov_bbb.mp4", likes: 520 },
            { id: 102, title: "Viral Trending Moment", channel: "My Channel", views: "45K", src: "https://www.w3schools.com/html/mov_bbb.mp4", likes: 1800 }
        ];

        let savedVideos = [];
        let currentPlayingVideo = null;

        window.onload = function() {
            renderCategories();
            renderVideos(videos);
            renderShorts();
            renderManageVideos();
            populateCategoryDropdowns();
        };

        function showToast(message) {
            let toast = document.getElementById('toastNotification');
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }

        function openTab(tabId) {
            document.querySelectorAll('.section-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            let selectedPanel = document.getElementById(tabId);
            if (selectedPanel) selectedPanel.classList.add('active');
            if (tabId === 'library') renderSavedVideos();
        }

        function toggleAmbientMode() {
            document.body.classList.toggle('ambient-mode');
        }

        function renderCategories() {
            let nav = document.getElementById('categoryNav');
            nav.innerHTML = categories.map((cat, idx) => 
                `<button class="cat-pill ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>`
            ).join('');
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            if (cat === "All") renderVideos(videos);
            else renderVideos(videos.filter(v => v.category === cat));
        }

        function renderVideos(list) {
            let grid = document.getElementById('homeVideoGrid');
            if (list.length === 0) {
                grid.innerHTML = `<p style="color:#aaa; font-size:12px;">No videos available.</p>`;
                return;
            }
            grid.innerHTML = list.map(v => `
                <div class="video-card" onclick="playVideo(${v.id})">
                    <div class="thumbnail-box">
                        <video src="${v.src}#t=0.5" preload="metadata"></video>
                    </div>
                    <div class="video-details">
                        <div class="channel-avatar">${v.channel.charAt(0)}</div>
                        <div class="video-meta">
                            <div class="video-title">${v.title}</div>
                            <div class="channel-name">${v.channel}</div>
                            <div class="video-stats">${v.views} views • Just now</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderShorts() {
            let feed = document.getElementById('shortsFeed');
            feed.innerHTML = shorts.map(s => `
                <div class="short-card">
                    <video src="${s.src}" loop onclick="this.paused ? this.play() : this.pause()"></video>
                    <div class="short-overlay">
                        <strong style="font-size:14px; display:block;">${s.channel}</strong>
                        <p style="font-size:12px; color:#ddd;">${s.title}</p>
                    </div>
                    <div class="short-actions">
                        <button class="short-action-btn" onclick="showToast('Liked!')"><i class="fa-solid fa-heart"></i><span>${s.likes}</span></button>
                        <button class="short-action-btn" onclick="openShareModal()"><i class="fa-solid fa-share"></i><span>Share</span></button>
                    </div>
                </div>
            `).join('');
        }

        function playVideo(id) {
            let v = videos.find(item => item.id === id);
            if (!v) return;
            
            v.views += 1;
            currentPlayingVideo = v;

            let modal = document.getElementById('playerModal');
            let player = document.getElementById('mainVideoPlayer');
            
            player.src = v.src;
            document.getElementById('playerVideoTitle').innerText = v.title;
            document.getElementById('playerVideoMeta').innerText = `${v.views} views • Just now`;
            document.getElementById('playerChannelName').innerText = v.channel;
            document.getElementById('playerChannelAvatar').innerText = v.channel.charAt(0);
            document.getElementById('playerSubCount').innerText = `${v.subscribers} subscribers`;
            
            updateLikeUI();
            updateSubscribeUI();

            modal.classList.add('active');
            player.play();
            renderVideos(videos);
        }

        function toggleLike() {
            if (!currentPlayingVideo) return;

            if (!currentPlayingVideo.isLiked) {
                currentPlayingVideo.likes += 1;
                currentPlayingVideo.isLiked = true;
                showToast("Liked!");
            } else {
                currentPlayingVideo.likes -= 1;
                currentPlayingVideo.isLiked = false;
                showToast("Unliked!");
            }
            updateLikeUI();
        }

        function updateLikeUI() {
            let likeBtn = document.getElementById('likeBtn');
            document.getElementById('likeCount').innerText = currentPlayingVideo.likes;
            if (currentPlayingVideo.isLiked) {
                likeBtn.classList.add('liked');
            } else {
                likeBtn.classList.remove('liked');
            }
        }

        function toggleSubscribe() {
            if (!currentPlayingVideo) return;

            if (!currentPlayingVideo.isSubscribed) {
                currentPlayingVideo.subscribers += 1;
                currentPlayingVideo.isSubscribed = true;
                showToast("Subscribed for Free!");
            } else {
                currentPlayingVideo.subscribers -= 1;
                currentPlayingVideo.isSubscribed = false;
                showToast("Unsubscribed!");
            }
            updateSubscribeUI();
        }

        function updateSubscribeUI() {
            let subBtn = document.getElementById('subBtn');
            document.getElementById('playerSubCount').innerText = `${currentPlayingVideo.subscribers} subscribers`;
            if (currentPlayingVideo.isSubscribed) {
                subBtn.innerText = "Subscribed";
                subBtn.classList.add('subscribed');
            } else {
                subBtn.innerText = "Subscribe";
                subBtn.classList.remove('subscribed');
            }
        }

        /* Share Options Modal Handlers */
        function openShareModal() {
            document.getElementById('shareModal').style.display = 'flex';
        }

        function closeShareModal() {
            document.getElementById('shareModal').style.display = 'none';
        }

        function shareToWhatsApp() {
            let url = encodeURIComponent(window.location.href);
            window.open(`https://api.whatsapp.com/send?text=Watch%20this%20video%20on%20Mystreem:%20${url}`, '_blank');
            closeShareModal();
        }

        function shareToInstagram() {
            showToast("Instagram link copied! Share in DMs.");
            navigator.clipboard.writeText(window.location.href);
            closeShareModal();
        }

        function shareToFacebook() {
            let url = encodeURIComponent(window.location.href);
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
            closeShareModal();
        }

        function copyVideoLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast("Link copied to clipboard!");
            closeShareModal();
        }

        function closePlayer() {
            let modal = document.getElementById('playerModal');
            let player = document.getElementById('mainVideoPlayer');
            player.pause();
            modal.classList.remove('active');
        }

        function triggerSuperThanks() {
            document.getElementById('thanksModal').style.display = 'flex';
        }

        function closeThanksModal() {
            document.getElementById('thanksModal').style.display = 'none';
        }

        function confirmSuperThanks() {
            let amount = document.getElementById('thanksAmountInput').value;
            closeThanksModal();
            showToast(`Super Thanks of ₹${amount} sent!`);
        }

        function saveToWatchLater() {
            if (currentPlayingVideo) {
                let exists = savedVideos.some(v => v.id === currentPlayingVideo.id);
                if (!exists) {
                    savedVideos.push(currentPlayingVideo);
                    showToast("Saved to Watch Later!");
                } else {
                    showToast("Already in Watch Later!");
                }
            }
        }

        function renderSavedVideos() {
            let container = document.getElementById('savedVideosList');
            if (savedVideos.length === 0) {
                container.innerHTML = `<p style="color:#aaa; font-size:12px;">No saved videos.</p>`;
                return;
            }
            container.innerHTML = savedVideos.map(v => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:10px; border-radius:8px; margin-bottom:8px;">
                    <div>
                        <strong style="font-size:13px; color:#fff;">${v.title}</strong>
                        <p style="font-size:11px; color:#aaa;">${v.views} views</p>
                    </div>
                    <button class="btn-action" style="width:auto; padding:6px 12px;" onclick="playVideo(${v.id})">Play</button>
                </div>
            `).join('');
        }

        function addComment() {
            let input = document.getElementById('commentInput');
            let text = input.value.trim();
            if (!text) return;

            let list = document.getElementById('commentsList');
            let item = document.createElement('div');
            item.className = 'comment-item';
            item.innerHTML = `<div class="comment-avatar">U</div><div class="comment-text"><strong>You:</strong> ${text}</div>`;
            list.appendChild(item);
            input.value = '';
            showToast("Comment added!");
        }

        function filterVideos() {
            let q = document.getElementById('searchInput').value.toLowerCase();
            let filtered = videos.filter(v => v.title.toLowerCase().includes(q));
            renderVideos(filtered);
        }

        function populateCategoryDropdowns() {
            let sel = document.getElementById('videoCategoryInput');
            sel.innerHTML = categories.filter(c => c !== 'All').map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function publishVideo() {
            let title = document.getElementById('videoTitleInput').value.trim();
            let category = document.getElementById('videoCategoryInput').value;
            let type = document.getElementById('contentTypeInput').value;

            if (!title) {
                showToast('Enter title!');
                return;
            }

            if (type === 'short') {
                let newShort = {
                    id: Date.now(),
                    title: title,
                    channel: "My Channel",
                    views: "1",
                    src: "https://www.w3schools.com/html/mov_bbb.mp4",
                    likes: 0
                };
                shorts.unshift(newShort);
                renderShorts();
                showToast('Short Published!');
                openTab('shorts');
            } else {
                let newVid = {
                    id: Date.now(),
                    title: title,
                    channel: "My Channel",
                    views: 0,
                    category: category,
                    src: "https://www.w3schools.com/html/mov_bbb.mp4",
                    likes: 0,
                    subscribers: 1250,
                    isSubscribed: false,
                    isLiked: false,
                    type: 'long'
                };
                videos.unshift(newVid);
                renderVideos(videos);
                renderManageVideos();
                showToast('Video Published!');
                openTab('home');
            }

            document.getElementById('videoTitleInput').value = '';
        }

        function renderManageVideos() {
            let list = document.getElementById('manageVideosList');
            list.innerHTML = videos.map(v => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:10px; border-radius:8px; margin-bottom:8px;">
                    <div>
                        <strong style="font-size:13px; color:#fff;">${v.title}</strong>
                        <p style="font-size:11px; color:#aaa;">${v.views} views</p>
                    </div>
                    <button class="btn-danger" onclick="deleteVideo(${v.id})">Delete</button>
                </div>
            `).join('');
            document.getElementById('dashViews').innerText = videos.reduce((acc, curr) => acc + curr.views, 0);
        }

        function deleteVideo(id) {
            videos = videos.filter(v => v.id !== id);
            renderVideos(videos);
            renderManageVideos();
            showToast('Video deleted');
        }
    </script>
</body>
</html>
