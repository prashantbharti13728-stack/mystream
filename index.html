<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStream - YouTube & Reels Platform</title>
    <!-- App Manifest for PWABuilder APK -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00e676">
    
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #0f0f0f; color: #fff; padding-bottom: 70px; }
        
        /* Top Navigation Bar */
        header { 
            position: sticky; top: 0; z-index: 100; background: #0f0f0f; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 12px 16px; border-bottom: 1px solid #222; 
        }
        .logo { color: #00e676; font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .auth-btn { background: #00e676; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Navigation Tabs (YouTube vs Reels) */
        .tabs { display: flex; justify-content: center; background: #181818; border-bottom: 1px solid #272727; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; background: none; border: none; color: #888; font-size: 15px; font-weight: bold; cursor: pointer; border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #00e676; border-bottom: 2px solid #00e676; }

        .container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        /* Upload Section */
        .upload-card { background: #1e1e1e; padding: 18px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #2c2c2c; }
        .upload-card h3 { color: #00e676; margin-bottom: 12px; font-size: 18px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; }
        .input-group input, .input-group textarea, .input-group select { 
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #121212; color: #fff; font-size: 14px; 
        }
        button.btn-primary { background: #00e676; color: #000; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 25px; cursor: pointer; font-size: 15px; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status { margin-top: 10px; font-size: 13px; color: #ffeb3b; text-align: center; }

        /* YouTube-Style Feed (16:9 Aspect Ratio Videos) */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .video-card { background: #181818; border-radius: 12px; overflow: hidden; border: 1px solid #252525; }
        .video-wrapper { position: relative; width: 100%; padding-top: 56.25%; /* 16:9 Ratio */ background: #000; }
        .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .video-info { padding: 12px; }
        .video-title { font-weight: bold; font-size: 15px; margin-bottom: 6px; color: #fff; line-height: 1.3; }
        .video-meta { font-size: 12px; color: #aaa; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .actions { display: flex; gap: 20px; border-top: 1px solid #2a2a2a; padding-top: 10px; }
        .action-btn { background: none; border: none; color: #aaa; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
        .action-btn:hover, .action-btn.active { color: #00e676; }

        /* Instagram Reels Feed (Vertical Full Screen) */
        .reels-container { display: flex; flex-direction: column; gap: 20px; max-width: 420px; margin: 0 auto; }
        .reel-card { position: relative; width: 100%; height: 80vh; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid #333; }
        .reel-card video { width: 100%; height: 100%; object-fit: cover; }
        .reel-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.85)); color: #fff; }
        .reel-actions { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .reel-action-btn { background: rgba(0,0,0,0.5); border: none; color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; font-size: 18px; }

        /* Ad Banners */
        .ad-banner { background: #161616; border: 1px dashed #333; text-align: center; padding: 12px; margin: 15px 0; color: #777; border-radius: 8px; font-size: 12px; }

        /* Bottom Mobile Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f0f; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; }
        .nav-item { color: #888; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #00e676; }
        .nav-item i { font-size: 18px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-play-circle"></i> MyStream</div>
        <button class="auth-btn" onclick="handleAuth()"><i class="fa-solid fa-user"></i> Login</button>
    </header>

    <!-- Top Ads Banner -->
    <div class="container">
        <div class="ad-banner">📢 AdSpace - Adsense Banner Placeholder</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" id="tabHome" onclick="switchTab('home')"><i class="fa-solid fa-house"></i> Home (YouTube)</button>
        <button class="tab-btn" id="tabReels" onclick="switchTab('reels')"><i class="fa-solid fa-clapperboard"></i> Reels (Instagram)</button>
    </div>

    <div class="container">

        <!-- Upload Section -->
        <div class="upload-card">
            <h3><i class="fa-solid fa-cloud-arrow-up"></i> Video / Reel Upload Karein</h3>
            <div class="input-group">
                <label>Video Title</label>
                <input type="text" id="videoTitle" placeholder="Apni video ka title likhein...">
            </div>
            <div class="input-group">
                <label>Video Type</label>
                <select id="videoType">
                    <option value="youtube">Horizontal Video (YouTube Style)</option>
                    <option value="reel">Vertical Short/Reel (Instagram Style)</option>
                </select>
            </div>
            <div class="input-group">
                <label>File Select Karein</label>
                <input type="file" id="videoInput" accept="video/*">
            </div>
            <button class="btn-primary" id="uploadBtn" onclick="uploadVideo()">Upload Video</button>
            <div id="status"></div>
        </div>

        <!-- YouTube Feed -->
        <div id="homeSection">
            <h2><i class="fa-solid fa-fire"></i> Trending Videos</h2>
            <br>
            <div id="videoGrid" class="video-grid">
                <p id="loadingText">Videos loading ho rahi hain...</p>
            </div>
        </div>

        <!-- Instagram Reels Feed -->
        <div id="reelsSection" style="display: none;">
            <div id="reelsGrid" class="reels-container">
                <p id="reelsLoadingText">Reels loading ho rahi hain...</p>
            </div>
        </div>

    </div>

    <!-- Bottom Mobile Menu -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="switchTab('reels')">
            <i class="fa-solid fa-bolt"></i>
            <span>Reels</span>
        </div>
        <div class="nav-item" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <i class="fa-solid fa-plus-circle"></i>
            <span>Upload</span>
        </div>
        <div class="nav-item" onclick="handleAuth()">
            <i class="fa-solid fa-circle-user"></i>
            <span>Profile</span>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tkrrvseibcgsasqlfjbu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-3GqiSqvlunpjVtJN4aQOA_aQFV04QB';
        const BUCKET_NAME = 'videos';

        let supabaseClient;
        if (window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        function switchTab(tab) {
            const homeSec = document.getElementById('homeSection');
            const reelsSec = document.getElementById('reelsSection');
            const tabHome = document.getElementById('tabHome');
            const tabReels = document.getElementById('tabReels');

            if (tab === 'home') {
                homeSec.style.display = 'block';
                reelsSec.style.display = 'none';
                tabHome.classList.add('active');
                tabReels.classList.remove('active');
            } else {
                homeSec.style.display = 'none';
                reelsSec.style.display = 'block';
                tabReels.classList.add('active');
                tabHome.classList.remove('active');
            }
        }

        function handleAuth() {
            const email = prompt("Apna Email daalein Login / Sign Up ke liye:");
            if (email) alert("Login link aapke email par bhej diya gaya hai!");
        }

        async function uploadVideo() {
            const fileInput = document.getElementById('videoInput');
            const titleInput = document.getElementById('videoTitle');
            const videoType = document.getElementById('videoType').value;
            const uploadBtn = document.getElementById('uploadBtn');
            const status = document.getElementById('status');

            if (!fileInput.files.length) {
                alert("Kripya pehle video select karein!");
                return;
            }

            const file = fileInput.files[0];
            const cleanFileName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
            const fileName = `${videoType}_${Date.now()}_${cleanFileName}`;

            uploadBtn.disabled = true;
            status.innerText = "Video upload ho rahi hai... Kripya rukiye.";

            try {
                const { data, error } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .upload(fileName, file, { cacheControl: '3600', upsert: false });

                if (error) {
                    status.innerText = "Upload Error: " + error.message;
                } else {
                    status.innerText = "Video kamyabi se upload ho gayi!";
                    fileInput.value = '';
                    titleInput.value = '';
                    fetchVideos();
                }
            } catch (err) {
                status.innerText = "Error: " + err.message;
            } finally {
                uploadBtn.disabled = false;
            }
        }

        async function fetchVideos() {
            const videoGrid = document.getElementById('videoGrid');
            const reelsGrid = document.getElementById('reelsGrid');

            try {
                const { data, error } = await supabaseClient.storage
                    .from(BUCKET_NAME)
                    .list('', { limit: 100, sortBy: { column: 'created_at', order: 'desc' } });

                if (error) return;

                if (!data || data.length === 0) {
                    videoGrid.innerHTML = "<p>Koi video nahi mili.</p>";
                    reelsGrid.innerHTML = "<p>Koi reel nahi mili.</p>";
                    return;
                }

                videoGrid.innerHTML = '';
                reelsGrid.innerHTML = '';

                data.forEach(item => {
                    if (item.name === '.emptyFolderPlaceholder') return;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from(BUCKET_NAME)
                        .getPublicUrl(item.name);

                    // Check if Reel or YouTube style
                    if (item.name.startsWith('reel_')) {
                        // Instagram Reel
                        const reelCard = document.createElement('div');
                        reelCard.className = 'reel-card';
                        reelCard.innerHTML = `
                            <video loop onclick="this.paused ? this.play() : this.pause()" src="${publicUrlData.publicUrl}"></video>
                            <div class="reel-overlay">
                                <h3>@mystream_user</h3>
                                <p>Trending Reel on MyStream 🔥</p>
                            </div>
                            <div class="reel-actions">
                                <button class="reel-action-btn" onclick="this.style.color='#00e676'"><i class="fa-solid fa-heart"></i></button>
                                <button class="reel-action-btn" onclick="alert('Share link copied!')"><i class="fa-solid fa-share"></i></button>
                            </div>
                        `;
                        reelsGrid.appendChild(reelCard);
                    } else {
                        // YouTube Video
                        const videoCard = document.createElement('div');
                        videoCard.className = 'video-card';
                        videoCard.innerHTML = `
                            <div class="video-wrapper">
                                <video controls src="${publicUrlData.publicUrl}"></video>
                            </div>
                            <div class="video-info">
                                <div class="video-title">MyStream Special Video</div>
                                <div class="video-meta">
                                    <span><i class="fa-solid fa-eye"></i> 1.2K views</span>
                                    <span>2 hours ago</span>
                                </div>
                                <div class="actions">
                                    <button class="action-btn" onclick="this.classList.toggle('active')"><i class="fa-solid fa-thumbs-up"></i> Like</button>
                                    <button class="action-btn" onclick="alert('Comment box opening...')"><i class="fa-solid fa-comment"></i> Comment</button>
                                    <button class="action-btn" onclick="alert('Video link copied!')"><i class="fa-solid fa-share"></i> Share</button>
                                </div>
                            </div>
                        `;
                        videoGrid.appendChild(videoCard);
                    }
                });
            } catch (err) {
                console.error(err);
            }
        }

        window.onload = function() {
            fetchVideos();
        };
    </script>
</body>
</html>
