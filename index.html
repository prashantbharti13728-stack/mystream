<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mystreem - Watch & Stream</title>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            width: 100vw; 
            height: 100vh; 
            background-color: #0f0f0f; 
            color: #ffffff; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header { 
            height: 56px;
            background: #0f0f0f; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 12px; 
            border-bottom: 1px solid #222;
            flex-shrink: 0;
            gap: 10px;
        }

        .logo-container { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            cursor: pointer; 
            flex-shrink: 0;
        }

        .mystreem-logo-icon {
            width: 32px; 
            height: 32px; 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%);
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            font-size: 14px;
        }

        .logo-text { 
            font-size: 18px; 
            font-weight: 800; 
            background: linear-gradient(90deg, #d946ef 0%, #00d2ff 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }

        .search-box-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: #181818;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 6px 12px;
            max-width: 400px;
        }

        .search-box-container input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 13px;
            padding-left: 6px;
        }

        .search-box-container i {
            color: #888;
            font-size: 14px;
        }

        /* Filter Pills Scroll Bar */
        .category-nav { 
            height: 48px;
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding: 8px 12px; 
            background: #0f0f0f; 
            border-bottom: 1px solid #1a1a1a; 
            flex-shrink: 0;
            scrollbar-width: none; 
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-pill { 
            background: #272727; 
            color: #f1f1f1; 
            border: none; 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 12px; 
            font-weight: 500; 
            cursor: pointer; 
            white-space: nowrap; 
        }

        .cat-pill.active { 
            background: #fff; 
            color: #0f0f0f; 
        }

        /* Content Area */
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #0f0f0f;
            padding-bottom: 20px;
        }

        .section-panel { display: none; }
        .section-panel.active { display: block; }

        /* Video Feed Grid */
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 600px) {
            .video-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* Video Card Component */
        .video-card {
            background: #121212;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #1f1f1f;
        }

        .thumbnail-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumbnail-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-details {
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        .channel-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a100ff, #00d2ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .video-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .video-title {
            font-size: 13px;
            font-weight: 600;
            color: #f1f1f1;
            line-height: 1.3;
        }

        .channel-name, .video-stats {
            font-size: 11px;
            color: #aaa;
        }

        /* Player Modal */
        .player-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0f0f0f;
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .player-modal.active { display: flex; }

        .player-header {
            height: 48px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121212;
            border-bottom: 1px solid #222;
        }

        .video-screen {
            width: 100%;
            max-height: 250px;
            background: #000;
        }

        .video-screen video {
            width: 100%;
            height: 100%;
        }

        .player-info-box { padding: 12px; }

        /* Shorts Container */
        .shorts-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .short-card {
            width: 100%;
            max-width: 360px;
            height: 500px;
            background: #181818;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid #282828;
        }

        .short-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Studio & Form Styles */
        .card { 
            background: #181818; 
            border: 1px solid #282828; 
            border-radius: 12px; 
            padding: 16px; 
            margin-bottom: 16px; 
        }

        .card-title { 
            font-size: 15px; 
            font-weight: 700; 
            color: #00d2ff; 
            margin-bottom: 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px; 
            background: #0f0f0f; 
            border: 1px solid #333; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 13px; 
            outline: none; 
        }

        .btn-action { 
            background: linear-gradient(90deg, #a100ff 0%, #00d2ff 100%); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 20px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            width: 100%; 
        }

        .btn-danger {
            background: #e53935;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .manage-item { display: flex; justify-content: space-between; align-items: center; background: #111; border: 1px solid #252525; border-radius: 8px; padding: 10px; margin-bottom: 10px; }

        /* FIXED Bottom Nav */
        .bottom-nav { 
            height: 60px;
            background: #121212; 
            border-top: 1px solid #222; 
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            flex-shrink: 0;
            z-index: 1000;
        }

        .nav-item { 
            color: #888; 
            font-size: 11px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 3px; 
            cursor: pointer; 
            flex: 1; 
            border: none;
            background: transparent;
            height: 100%;
        }

        .nav-item.active { color: #fff; }
        .nav-item i { font-size: 18px; }

        .nav-item-plus { 
            background: linear-gradient(135deg, #a100ff 0%, #00d2ff 100%); 
            width: 42px; 
            height: 30px; 
            border-radius: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 16px; 
            color: #fff; 
        }
    </style>
</head>
<body>

    <!-- Top Header -->
    <header>
        <div class="logo-container" onclick="openTab('home')">
            <div class="mystreem-logo-icon"><i class="fa-solid fa-play"></i></div>
            <div class="logo-text">Mystreem</div>
        </div>

        <div class="search-box-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search videos..." oninput="filterVideos()">
        </div>
    </header>

    <!-- Category Pills -->
    <div class="category-nav">
        <button class="cat-pill active" onclick="filterCategory('All', this)">All</button>
        <button class="cat-pill" onclick="filterCategory('Tech & Electronics', this)">Tech & Electronics</button>
        <button class="cat-pill" onclick="filterCategory('Mobile Repairing', this)">Mobile Repairing</button>
        <button class="cat-pill" onclick="filterCategory('Business Ideas', this)">Business Ideas</button>
    </div>

    <!-- Main Content -->
    <div class="content-container">

        <!-- 1. HOME -->
        <div id="home" class="section-panel active">
            <div class="video-grid" id="homeVideoGrid"></div>
        </div>

        <!-- 2. SHORTS -->
        <div id="shorts" class="section-panel">
            <div class="shorts-container" id="shortsFeedGrid"></div>
        </div>

        <!-- 3. UPLOAD -->
        <div id="upload" class="section-panel">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-upload"></i> Upload Video</div>
                
                <div class="form-group">
                    <label>Type</label>
                    <select id="uploadTypeSelect">
                        <option value="Long Video">Long Video</option>
                        <option value="Shorts">YouTube Short</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Video File</label>
                    <input type="file" id="videoFileInput" accept="video/*">
                </div>

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="videoTitleInput" placeholder="Video title...">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="videoCategoryInput">
                        <option value="Tech & Electronics">Tech & Electronics</option>
                        <option value="Mobile Repairing">Mobile Repairing</option>
                        <option value="Business Ideas">Business Ideas</option>
                    </select>
                </div>

                <button class="btn-action" onclick="publishVideo()">Publish</button>
            </div>
        </div>

        <!-- 4. DASHBOARD -->
        <div id="dashboard" class="section-panel">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-chart-pie"></i> Analytics</div>
                <p>Total Views: <b id="dashViews">0</b></p>
                <p>Total Videos: <b id="dashVideos">0</b></p>
            </div>
        </div>

        <!-- 5. MANAGE -->
        <div id="manage" class="section-panel">
            <div class="card">
                <div class="card-title"><i class="fa-solid fa-list-check"></i> Manage Videos</div>
                <div id="manageVideosList"></div>
            </div>
        </div>

    </div>

    <!-- Video Player Modal -->
    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <span>Mystreem Player</span>
            <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:18px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="video-screen">
            <video id="mainActiveVideo" controls autoplay></video>
        </div>
        <div class="player-info-box">
            <h3 id="playerTitle">Video Title</h3>
            <p id="playerStats" style="font-size:11px; color:#aaa; margin-top:4px;">0 views</p>
        </div>
    </div>

    <!-- FIXED BOTTOM NAVIGATION BAR -->
    <div class="bottom-nav">
        <button class="nav-item active" id="bnav-home" onclick="openTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" id="bnav-shorts" onclick="openTab('shorts')">
            <i class="fa-solid fa-bolt"></i>
            <span>Shorts</span>
        </button>
        <button class="nav-item" id="bnav-upload" onclick="openTab('upload')">
            <div class="nav-item-plus"><i class="fa-solid fa-plus"></i></div>
        </button>
        <button class="nav-item" id="bnav-manage" onclick="openTab('manage')">
            <i class="fa-solid fa-film"></i>
            <span>Manage</span>
        </button>
        <button class="nav-item" id="bnav-dashboard" onclick="openTab('dashboard')">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Studio</span>
        </button>
    </div>

    <script>
        let videos = JSON.parse(localStorage.getItem('mystreem_videos')) || [
            {
                id: 101,
                title: "How to Repair Mobile Screen - Complete Guide",
                category: "Mobile Repairing",
                type: "Long Video",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                views: 120,
                channel: "Tech Master"
            },
            {
                id: 102,
                title: "Mobile Screen Replacement #Shorts",
                category: "Mobile Repairing",
                type: "Shorts",
                videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
                views: 450,
                channel: "Shorts King"
            }
        ];

        function saveStorage() {
            localStorage.setItem('mystreem_videos', JSON.stringify(videos));
        }

        function openTab(tabId) {
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');

            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('bnav-' + tabId).classList.add('active');

            renderAll();
        }

        function publishVideo() {
            const title = document.getElementById('videoTitleInput').value.trim();
            const category = document.getElementById('videoCategoryInput').value;
            const type = document.getElementById('uploadTypeSelect').value;
            const fileInput = document.getElementById('videoFileInput');

            if(!title) { alert('Please enter Title!'); return; }

            let videoUrl = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
            if(fileInput.files && fileInput.files[0]) {
                videoUrl = URL.createObjectURL(fileInput.files[0]);
            }

            videos.unshift({
                id: Date.now(),
                title: title,
                category: category,
                type: type,
                videoUrl: videoUrl,
                views: 1,
                channel: "My Channel"
            });

            saveStorage();
            alert('Video Uploaded!');
            document.getElementById('videoTitleInput').value = '';
            openTab('home');
        }

        function renderHomeVideos(list) {
            const grid = document.getElementById('homeVideoGrid');
            grid.innerHTML = '';
            const displayList = list || videos.filter(v => v.type === 'Long Video');

            if(displayList.length === 0) {
                grid.innerHTML = `<p style="color:#888; text-align:center; padding:20px;">No videos available.</p>`;
                return;
            }

            displayList.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(v);
                card.innerHTML = `
                    <div class="thumbnail-box">
                        <video src="${v.videoUrl}#t=0.5" preload="metadata"></video>
                    </div>
                    <div class="video-details">
                        <div class="channel-avatar">M</div>
                        <div class="video-meta">
                            <div class="video-title">${v.title}</div>
                            <div class="channel-name">${v.channel}</div>
                            <div class="video-stats">${v.views} views</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderShorts() {
            const grid = document.getElementById('shortsFeedGrid');
            grid.innerHTML = '';
            const list = videos.filter(v => v.type === 'Shorts');

            list.forEach(s => {
                const card = document.createElement('div');
                card.className = 'short-card';
                card.innerHTML = `<video src="${s.videoUrl}" controls autoplay loop muted></video>`;
                grid.appendChild(card);
            });
        }

        function playVideo(v) {
            v.views += 1;
            saveStorage();
            document.getElementById('playerTitle').innerText = v.title;
            document.getElementById('playerStats').innerText = `${v.views} views`;
            const playerVid = document.getElementById('mainActiveVideo');
            playerVid.src = v.videoUrl;
            document.getElementById('playerModal').classList.add('active');
        }

        function closePlayer() {
            const playerVid = document.getElementById('mainActiveVideo');
            playerVid.pause();
            document.getElementById('playerModal').classList.remove('active');
        }

        function filterVideos() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderHomeVideos(videos.filter(v => v.title.toLowerCase().includes(q)));
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            if(cat === 'All') renderHomeVideos();
            else renderHomeVideos(videos.filter(v => v.category === cat));
        }

        function renderManageVideos() {
            const list = document.getElementById('manageVideosList');
            list.innerHTML = '';
            videos.forEach(v => {
                const div = document.createElement('div');
                div.className = 'manage-item';
                div.innerHTML = `
                    <div>
                        <div style="font-size:13px; font-weight:600;">${v.title}</div>
                        <div style="font-size:11px; color:#888;">${v.type} • ${v.views} views</div>
                    </div>
                    <button class="btn-danger" onclick="deleteVideo(${v.id})"><i class="fa-solid fa-trash"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function deleteVideo(id) {
            videos = videos.filter(v => v.id !== id);
            saveStorage();
            renderAll();
        }

        function renderDashboard() {
            let totalViews = videos.reduce((acc, v) => acc + v.views, 0);
            document.getElementById('dashViews').innerText = totalViews;
            document.getElementById('dashVideos').innerText = videos.length;
        }

        function renderAll() {
            renderHomeVideos();
            renderShorts();
            renderManageVideos();
            renderDashboard();
        }

        renderAll();
    </script>
</body>
</html>
